<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="675" fill="#eef5f6"/><rect width="1200" height="190" fill="#0b2c3c"/><text x="55" y="76" font-size="44" font-weight="700" fill="white">Texas Railroad Commission:</text><text x="55" y="134" font-size="44" font-weight="700" fill="white">Public Records for Mineral Rights</text><rect x="55" y="245" width="350" height="235" rx="16" fill="white" stroke="#bdcdd0" stroke-width="2"/><rect x="55" y="245" width="350" height="62" rx="16" fill="#236872"/><text x="77" y="287" font-size="30" fill="white" font-weight="700">RRC records</text><text x="77" y="354" font-size="27" fill="#153743">Lease production</text><text x="77" y="400" font-size="27" fill="#153743">Operator reports</text><text x="77" y="446" font-size="27" fill="#153743">Dates and revisions</text><rect x="425" y="245" width="350" height="235" rx="16" fill="white" stroke="#bdcdd0" stroke-width="2"/><rect x="425" y="245" width="350" height="62" rx="16" fill="#236872"/><text x="447" y="287" font-size="30" fill="white" font-weight="700">Royalty statement</text><text x="447" y="354" font-size="27" fill="#153743">Payor property ID</text><text x="447" y="400" font-size="27" fill="#153743">Sales month</text><text x="447" y="446" font-size="27" fill="#153743">Payment decimal</text><rect x="795" y="245" width="350" height="235" rx="16" fill="white" stroke="#bdcdd0" stroke-width="2"/><rect x="795" y="245" width="350" height="62" rx="16" fill="#236872"/><text x="817" y="287" font-size="30" fill="white" font-weight="700">County instruments</text><text x="817" y="354" font-size="27" fill="#153743">Recorded deeds</text><text x="817" y="400" font-size="27" fill="#153743">Estate documents</text><text x="817" y="446" font-size="27" fill="#153743">Chain research</text><text x="55" y="580" font-size="29" fill="#153743" font-weight="700">Connect identifiers and periods before comparing records.</text><text x="55" y="623" font-size="29" fill="#153743" font-weight="400">Production data alone does not prove ownership or underpayment.</text></g></svg>